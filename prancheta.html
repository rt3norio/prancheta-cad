function escapeHTML(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toSVG(){
  const bb = bbox() || {x0:0,y0:0,x1:1000,y1:1000};
  const m = 1500;
  const w = (bb.x1-bb.x0)+2*m, h = (bb.y1-bb.y0)+2*m;
  const X = x => (x-bb.x0+m).toFixed(1);
  const Y = y => (bb.y1+m-y).toFixed(1);
  let s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + 'mm" height="' + h + 'mm" viewBox="0 0 ' + w.toFixed(0) + ' ' + h.toFixed(0) + '">\n';
  // móveis primeiro, para as paredes ficarem por cima
  if(M.boxes.length){
    s += '<g stroke-width="6" font-family="sans-serif" font-size="150" text-anchor="middle">\n';
    for(const b of M.boxes){
      const pts = boxCorners(b).map(p => X(p.x) + ',' + Y(p.y)).join(' ');
      const borda = darken(b.color, .45).replace('rgb(', 'rgb(');
      s += '<polygon points="' + pts + '" fill="' + b.color + '" stroke="' + borda + '"/>';
      if(b.nome) s += '<text x="' + X(b.x) + '" y="' + Y(b.y) + '" dy="52" fill="' +
                      darken(b.color, .58) + '" stroke="none">' + escapeHTML(b.nome) + '</text>';
      s += '\n';
    }
    s += '</g>\n';
  }
  s += '<g fill="#1a1a1a" stroke="none">\n';
  for(const wl of M.walls){
    const u = wallDir(wl), n = wallNorm(wl), half = wl.t/2;
    for(const [d0,d1] of solidSpans(wl)){
      const pts = [
        [wl.ax+u.x*d0+n.x*half, wl.ay+u.y*d0+n.y*half],
        [wl.ax+u.x*d1+n.x*half, wl.ay+u.y*d1+n.y*half],
        [wl.ax+u.x*d1-n.x*half, wl.ay+u.y*d1-n.y*half],
        [wl.ax+u.x*d0-n.x*half, wl.ay+u.y*d0-n.y*half]
      ].map(p => X(p[0]) + ',' + Y(p[1])).join(' ');
      s += '<polygon points="' + pts + '"/>\n';
    }
  }
  s += '</g>\n<g stroke="#1a1a1a" stroke-width="8" fill="none" font-family="sans-serif" font-size="180">\n';
  const c = centroid();
  const dimSVG = (a,b,off) => {
    const L = dist(a,b); if(L < 1) return '';
    const u = {x:(b.x-a.x)/L, y:(b.y-a.y)/L}, n = {x:-u.y, y:u.x};
    const A = {x:a.x+n.x*off, y:a.y+n.y*off}, B = {x:b.x+n.x*off, y:b.y+n.y*off};
    let ang = Math.atan2(-(B.y-A.y)*0 + (B.y-A.y), B.x-A.x)*180/Math.PI;
    ang = -ang; if(ang > 90 || ang < -90) ang += 180;
    const mx = (A.x+B.x)/2, my = (A.y+B.y)/2;
    return '<path d="M' + X(A.x) + ',' + Y(A.y) + ' L' + X(B.x) + ',' + Y(B.y) + '"/>' +
      '<path d="M' + X(a.x) + ',' + Y(a.y) + ' L' + X(A.x) + ',' + Y(A.y) + '" stroke-width="4"/>' +
      '<path d="M' + X(b.x) + ',' + Y(b.y) + ' L' + X(B.x) + ',' + Y(B.y) + '" stroke-width="4"/>' +
      '<text x="' + X(mx) + '" y="' + Y(my) + '" transform="rotate(' + ang.toFixed(2) + ' ' + X(mx) + ' ' + Y(my) + ')" ' +
      'dy="-60" text-anchor="middle" fill="#1a1a1a" stroke="none">' + U.fmt(L) + '</text>\n';
  };
  if(CFG.autoDim){
    for(const wl of M.walls){
      const n = wallNorm(wl);
      const mid = {x:(wl.ax+wl.bx)/2, y:(wl.ay+wl.by)/2};
      const away = ((mid.x-c.x)*n.x + (mid.y-c.y)*n.y) >= 0 ? 1 : -1;
      s += dimSVG({x:wl.ax,y:wl.ay}, {x:wl.bx,y:wl.by}, away*(wl.t/2+350));
    }
  }
  for(const d of M.dims) s += dimSVG({x:d.ax,y:d.ay}, {x:d.bx,y:d.by}, d.off);
  s += '</g>\n</svg>';
  return s;
}

/* ---------------- planta de demonstração ---------------- */
function demo(){
  M = {walls:[], ops:[], dims:[], boxes:[], seq:1};
  const P = (x,y) => ({x:x*10, y:y*10});   // em cm
  const chain = pts => { for(let i=0;i<pts.length-1;i++) addWall(pts[i], pts[i+1]); };
  chain([P(0,0),P(900,0),P(900,650),P(0,650),P(0,0)]);            // perímetro
  chain([P(380,0),P(380,400)]);                                    // divisória vertical
  chain([P(380,400),P(900,400)]);                                  // divisória horizontal
  chain([P(0,400),P(380,400)]);
  const byEnds = (ax,ay,bx,by) => M.walls.find(w =>
    (Math.abs(w.ax-ax*10)<1 && Math.abs(w.ay-ay*10)<1 && Math.abs(w.bx-bx*10)<1 && Math.abs(w.by-by*10)<1));
  const add = (w, d, kind) => { if(w) M.ops.push({id:M.seq++, w:w.id, d:d*10, wid: kind==='porta'?800:1200,
      kind, h: kind==='porta'?2100:1200, sill: kind==='porta'?0:900}); };
  add(byEnds(0,0,900,0), 200, 'janela');
  add(byEnds(0,0,900,0), 650, 'porta');
  add(byEnds(900,650,0,650), 250, 'janela');
  add(byEnds(380,0,380,400), 300, 'porta');
  add(byEnds(380,400,900,400), 120, 'porta');
  add(byEnds(0,400,380,400), 190, 'porta');
  add(byEnds(900,0,900,650), 200, 'janela');

  // móveis: x, y, largura, profundidade em cm; altura e base em cm
  const mob = (x, y, w, d, h, z, cor, nome) => M.boxes.push({
    id:M.seq++, x:x*10, y:y*10, w:w*10, d:d*10, rot:0,
    h:h*10, z:z*10, color:cor, nome
  });
  // encostados nas FACES das paredes (eixo ± 7,5), não no eixo
  mob(190,   507.5, 160, 200,  55,   0, PALETA[0].c, 'Cama');     // dormitório
  mob( 37.5, 545,    60,  50, 220,   0, PALETA[5].c, 'Armário');
  mob(640,   530,   200,  90,  75,   0, PALETA[1].c, 'Mesa');     // sala
  mob(832.5, 200,   120,  60,  90,   0, PALETA[3].c, 'Bancada');  // cozinha
  mob(832.5, 330,   120,  35,  70, 140, PALETA[2].c, 'Aéreo');    // armário suspenso
  dirty3d = true;
}
